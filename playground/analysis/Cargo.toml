[package]
name = "easl_playground_analysis"
version = "0.0.0"
edition = "2024"

# The playground's editor support, compiled to WebAssembly: diagnostics,
# hover, go-to-definition, completion, formatting, semantic tokens, and
# structural editing, for one document. Most of it is easl_lsp's own code
# (`../../../easl_lsp/src`), included as-is; see src/lib.rs. Built by the
# docs generator.

[lib]
crate-type = ["cdylib"]

[dependencies]
easl = { path = "../../../easl" }
fsexp = { git = "https://github.com/Ella-Hoeppner/fsexp.git" }
serde_json = "1"
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
# easl_lsp's modules name their LSP types through `tower_lsp::lsp_types`;
# the shim provides that path without the server half of tower-lsp, which
# doesn't build for the browser.
tower-lsp = { path = "lsp-types-shim", package = "easl_playground_lsp_types" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

[workspace]
